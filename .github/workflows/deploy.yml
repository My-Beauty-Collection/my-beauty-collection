# Pubblica l'app su GitHub Pages a ogni push su main (o a mano da Actions → "Run workflow").
# Richiede: Settings → Pages → Source "GitHub Actions" e, in Settings → Secrets and variables →
# Actions → Variables, VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY (la chiave publishable/anon,
# pubblica per natura: finisce comunque nel bundle). Mai la secret key.
name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Mancano le variabili VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
          npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
